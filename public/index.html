<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>HERE WeGo API key generator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: rgba(15, 31, 52, 0.82);
        --panel-border: rgba(164, 194, 225, 0.2);
        --text: #f3f7fc;
        --muted: #8fa5bf;
        --accent: #45d6b2;
        --accent-dark: #0d6657;
        --danger: #ff8f9d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 15% 10%, rgba(35, 111, 167, 0.35), transparent 34rem),
          radial-gradient(circle at 90% 85%, rgba(19, 155, 123, 0.19), transparent 28rem),
          var(--bg);
        color: var(--text);
        display: flex;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        backdrop-filter: blur(22px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
        max-width: 560px;
        padding: clamp(28px, 7vw, 52px);
        width: 100%;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        margin: 0 0 14px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 3.25rem);
        letter-spacing: -0.05em;
        line-height: 0.98;
        margin: 0;
        max-width: 420px;
      }

      .intro {
        color: var(--muted);
        line-height: 1.6;
        margin: 20px 0 34px;
      }

      label {
        color: #c3d1e1;
        display: block;
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 9px;
      }

      .key-row {
        display: flex;
        gap: 10px;
      }

      input {
        background: rgba(3, 10, 20, 0.6);
        border: 1px solid rgba(164, 194, 225, 0.26);
        border-radius: 12px;
        color: var(--text);
        font: 500 0.95rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        min-width: 0;
        outline: none;
        padding: 15px;
        width: 100%;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(69, 214, 178, 0.16);
      }

      button {
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        font: 800 0.82rem/1.1 inherit;
        letter-spacing: 0.08em;
        min-height: 50px;
        padding: 0 20px;
        transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #generate {
        background: var(--accent);
        color: #06261f;
        min-width: 145px;
      }

      #copy {
        background: rgba(164, 194, 225, 0.12);
        color: #c7d7e8;
        display: none;
        margin-top: 12px;
        width: 100%;
      }

      #status {
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.45;
        margin: 14px 0 0;
        min-height: 1.25em;
      }

      #status.error {
        color: var(--danger);
      }

      .note {
        border-top: 1px solid rgba(164, 194, 225, 0.13);
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.5;
        margin-top: 34px;
        padding-top: 18px;
      }

      @media (max-width: 520px) {
        .key-row {
          flex-direction: column;
        }

        #generate {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Invisible HERE WeGo</p>
      <h1>Generate an API key.</h1>
      <p class="intro">
        Load HERE WeGo, capture its geocoding request, and return the key when it is ready.
      </p>

      <form id="generator-form">
        <label for="api-key">Generated API key</label>
        <div class="key-row">
          <input id="api-key" name="api-key" type="text" readonly
            placeholder="Your key will appear here" aria-live="polite" />
          <button id="generate" type="submit">GENERATE</button>
        </div>
        <button id="copy" type="button">COPY KEY</button>
        <p id="status" role="status"></p>
      </form>

      <p class="note">
        The key is generated on demand and is not stored by this interface.
      </p>
    </main>

    <script>
      const form = document.querySelector("#generator-form");
      const input = document.querySelector("#api-key");
      const generateButton = document.querySelector("#generate");
      const copyButton = document.querySelector("#copy");
      const status = document.querySelector("#status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        generateButton.disabled = true;
        copyButton.style.display = "none";
        input.value = "";
        status.className = "";
        status.textContent = "Opening HERE WeGo and waiting for a key…";

        try {
          const response = await fetch("/api/generate", { method: "POST" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Generation failed.");

          input.value = result.apiKey;
          copyButton.style.display = "block";
          status.textContent = "API key generated successfully.";
        } catch (error) {
          status.className = "error";
          status.textContent = error.message;
        } finally {
          generateButton.disabled = false;
        }
      });

      copyButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(input.value);
        status.className = "";
        status.textContent = "Copied to clipboard.";
      });
    </script>
  </body>
</html>
